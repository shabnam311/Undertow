name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: undertow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Setup Database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d undertow -c "CREATE EXTENSION IF NOT EXISTS vector;"
          cd packages/db && bun run drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/undertow
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/undertow
          AUTH_SECRET: test_ci_hmac_secret_key_1234567890_secure
          RAZORPAY_WEBHOOK_SECRET: test_ci_webhook_secret_key
